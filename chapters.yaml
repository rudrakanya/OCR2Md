  - id: C08
    title: "Udayeśvara in Stone"
    scope: "Temple architecture; plan, structure, style of the Udayeśvara / Neelkantheshwar temple; Bhūmija/Nagara śikhara."
    descriptor: >
      The architecture of the temple itself and of the tradition it belongs to. Ground plan
      and elevation; garbhagriha, antarala, mandapa and porches; the stellate or
      multi-spired superstructure; the Bhumija mode of shikhara with its latas and karnas
      rising in vertical rows of miniature shrines; Nagara temple form and its regional
      idioms; adhisthana mouldings, jangha, varandika, amalaka and kalasha; proportion,
      measurement and the canonical prescriptions of the vastu texts; comparison with other
      Paramara and central Indian temples; the structural logic of stone construction,
      corbelling and ceiling design.
