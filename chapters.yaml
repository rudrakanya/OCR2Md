  - id: C15
    title: "Stories of Udaypur"
    scope: "Festivals, folklore, oral histories, legends."
    descriptor: >
      What the place tells about itself. Festivals and fairs and how they are kept —
      Shivaratri, Nagpanchami, Dussehra, Diwali and the temple's own melas; folklore,
      legends and local tales about the temple, the tank and the kings; the stories told
