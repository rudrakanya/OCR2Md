  - id: C05
    title: "From Avanti to Malwa"
    scope: "Dynasties, trade routes, sacred cities; regional political evolution over time."
    descriptor: >
      The long political and commercial evolution of the region from ancient Avanti to
      medieval Malwa. Successive ruling powers before and around the Paramaras — Mauryas,
      Sungas, Satavahanas, Guptas, Aulikaras, Pratiharas, Kalachuris, Chandellas, Chalukyas;
      Ujjain, Dhara, Mandu and Vidisha as capitals and sacred cities; trade routes and
      caravan roads crossing the plateau; the shifting frontiers and overlordships of
      central India; the making of "Malwa" as a region with a name and an identity.
    keywords: [Avanti, Avantī, अवन्ति, Malwa, Mālava, मालव, Ujjain, Ujjayini, Ujjayinī, उज्जयिनी,
               Dhara, Dhārā, धारा, Dhar, Mandu, Mandapa-durga, Vidisha, Pratihara, Gurjara-Pratihara,
               Kalachuri, Chandella, Chalukya, Cālukya, Rashtrakuta, Rāṣṭrakūṭa, Gupta empire,
               trade route, caravan, mahajanapada, janapada, जनपद, capital city, sacred city,
               regional kingdom, political geography, overlordship, feudatory, samanta, सामन्त]
    negative_keywords: [soil type, rainfall, sculpture iconography, conservation repair]

  - id: C06
    title: "The Paramāras and Bhoja"
    scope: "Kingship, learning, temple building; Paramāra dynasty, Bhoja, court culture."
    descriptor: >
      The Paramara dynasty of Malwa and above all Bhoja. The dynasty's origin legends and
      the agnikula myth; the succession from Upendra, Siyaka, Vakpati Munja and Sindhuraja
      to Bhoja, Jayasimha, Udayaditya, Naravarman, Yashovarman, Arjunavarman and the later
      kings; wars with the Chalukyas, Kalachuris and the Ghaznavids; Bhoja as scholar-king,
      patron of learning and reputed author of treatises; the court, its poets and
      panegyrists; royal patronage of temples, tanks and cities; ideals of kingship,
      dharma and the good ruler.
    keywords: [Paramara, Paramāra, परमार, Parmar, Pramara, agnikula, agnikula myth, Mount Abu,
               Bhoja, Bhojadeva, भोजदेव, Raja Bhoj, राजा भोज, Munja, Vakpati, Vākpati, Sindhuraja,
               Upendra, Siyaka, Jayasimha, Naravarman, Yashovarman, Arjunavarman, Udayaditya,
               Bhojashala, Dhara capital, scholar king, patronage, dāna, dāna-śāsana,
               court poet, praśasti of kings, kingship, rājadharma, राजधर्म, dynasty succession,
               Chalukya war, Kalachuri, Tailapa, Bhima, Karna]
