  - id: C07
    title: "Udayāditya's Foundation"
    scope: "The founding of town, temple and tank under Udayāditya."
    descriptor: >
      The founding act. Udayaditya, Paramara king and successor of Bhoja through Jayasimha,
      and his establishment of the town of Udayapura together with its great Shiva temple
      and its tank or reservoir. The date and circumstances of the foundation; the
      foundation inscription and the naming of the temple after the founder; the making of
      a planned settlement — town, tank and temple conceived as one endowment; the
      endowment of land and villages to maintain the shrine; Udayaditya's reign, his
      recovery of Paramara fortunes, his other constructions and his successors.
    keywords: [Udayaditya, Udayāditya, उदयादित्य, Udayapura, Udaypur, Udayeshvara, Udayeśvara,
