  - id: C16
    title: "Conquests and Regimes"
    scope: "Decline of the socio-economic hub of Madhya Bharat; invasions, political shifts."
    descriptor: >
      Decline, conquest and the succession of regimes. The fall of the Paramaras and the
      end of Malwa's independence; the Delhi Sultanate, Alauddin Khalji and the Khaljis of
