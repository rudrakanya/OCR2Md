# =============================================================================
# chapters.yaml — the tagging targets (§7).
#
# HOW THIS IS USED
#   `descriptor` is embedded with the same model as the chunks, and every chunk
#   is scored by cosine similarity against all 19 descriptors. So the descriptor
#   is not a label — it is a QUERY, and it works best when written in the same
#   register and vocabulary as the passages it should match. That is why each
#   one below reads like a paragraph out of one of your books rather than like
#   a chapter title.
#
#   `keywords` are appended to the descriptor before embedding (weighted by
#   `keyword_weight`) and are also what the lexical/hybrid layer matches on.
#   Sanskrit/Hindi terms are included in BOTH IAST and Devanagari because the
#   corpus contains both: 10 of your 25 files carry Devanagari, and
#   samarangana-sutradhara.md alone has 331k Devanagari characters.
#
#   `negative_keywords` are used only by the §10.2 hard-negative test, to check
#   that e.g. a geology query does not surface iconography.
#
# TUNING: edit descriptors here and re-run `python -m src.tag` — this does NOT
# re-embed the corpus, only the 19 descriptors. Cheap. Iterate freely.
# =============================================================================

keyword_weight: 1          # times the keyword block is repeated before embedding

chapters:

  - id: C01
    title: "Udaypur: A Small Town with a Long Memory"
    scope: "Ancient scriptural references; Puranic/Sanskrit textual mentions of the region."
    descriptor: >
      Early textual and scriptural memory of the place. Mentions of the region in the
      Puranas and other Sanskrit literature; sacred geography and tirtha lists; the
      naming of towns and their legendary founders; how a settlement is remembered in
      myth and canonical text before it appears in documented history. Passages that
      locate Udaypur, Udayapura or the surrounding country within Puranic cosmography,
      pilgrimage itineraries and traditional accounts of origin.
    keywords: [Udaypur, Udayapura, Puranic, Purāṇa, पुराण, Skanda Purana, Skanda Purāṇa,
               tirtha, tīrtha, तीर्थ, mahatmya, māhātmya, माहात्म्य, sacred geography,
               scriptural reference, legend of foundation, Vidisha, Bhilsa, Besnagar,
               ancient name, place-name, kshetra, kṣetra, क्षेत्र, sthala, sthala-purana]
    negative_keywords: [monsoon rainfall, streamflow, conservation law, ASI notification]

  - id: C02
    title: "The Betwa Valley: Land, Rivers and Seasons"
    scope: "Physical geography; Betwa (Vetravati) river system, monsoon/seasons, Malwa plateau."
    descriptor: >
      The physical setting: the Betwa river, known in Sanskrit as the Vetravati, and its
      tributaries; the Malwa plateau and its drainage; catchment, basin and streamflow;
      rainfall and the monsoon cycle; temperature, climate and long-term climatic change;
      seasons and the agricultural year; the shape of the land, elevation, watersheds and
      the way water moves through the region. Hydrology, meteorology and physiography
      rather than history or art.
    keywords: [Betwa, Vetravati, Vetravatī, वेत्रवती, betwa basin, river, nadi, नदी,
               tributary, catchment, streamflow, discharge, hydrology, watershed,
               monsoon, rainfall, precipitation, climate, temperature, season, ritu, ऋतु,
               Malwa plateau, Bundelkhand, drainage, Bes river, Halali, topography,
               physiography, land use land cover]
    negative_keywords: [iconography, sikhara, inscription, praśasti, dynasty succession]

  - id: C03
    title: "Stones and Forests"
    scope: "Geology, flora, fauna, landscape; sandstone, soils, vegetation."
    descriptor: >
      Geology, natural resources and living landscape. Rock formations and building stone,
      particularly the sandstone quarried for temples; Vindhyan and Deccan trap formations;
      soils, black cotton soil and their fertility; forests and forest types, timber and
      minor forest produce; trees, plants and vegetation cover; wild animals, birds and
      the fauna of the district; quarries, minerals and the raw material a builder finds
      to hand. The land as substance and habitat.
    keywords: [geology, sandstone, stone quarry, quarrying, śilā, शिला, pathar, पत्थर,
               Vindhyan, Deccan trap, basalt, laterite, soil, black cotton soil, mrittika,
               forest, jungle, vana, वन, flora, fauna, vegetation, timber, tree species,
               wildlife, minerals, rock formation, building material, natural resources]
    negative_keywords: [praśasti, iconography, dynasty, festival, conservation policy]

  - id: C04
    title: "Before Udaypur"
    scope: "Prehistory and early-historic Vidisha; archaeology, Besnagar, early settlement."
    descriptor: >
      What was here before the town. Prehistoric and protohistoric occupation; stone-age
      tools, rock shelters and painted caves; the early-historic city of Vidisha and the
      mound of Besnagar; Sanchi and its stupas; Sunga, Satavahana and Gupta period remains;
      excavation reports, stratigraphy, pottery sequences, coins and terracottas; the
      Heliodorus pillar; early settlement patterns and the archaeological record of the
      Betwa-Bes confluence long before the Paramaras.
    keywords: [prehistory, protohistory, palaeolithic, neolithic, microlith, rock shelter,
