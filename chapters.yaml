  - id: C10
    title: "Words in Stone"
    scope: "Inscriptions, epigraphy, paleography; Nagari script, praśasti, languages of the inscriptions."
    descriptor: >
      Inscriptions and what can be read from them. The epigraphs of the temple and the
      region — foundation records, praśastis, copper-plate grants, pilgrim records, mason's
      marks and later graffiti; the serpentine scimitar inscription on the parapet slab;
      the Nagari script and its palaeography, letter forms and their dating; Sanskrit and
      Prakrit of the records; eras and dates, Vikrama and Shaka samvat, and their
      conversion; the editing of a text, its readings, lacunae and estampages; genealogy
      and historical fact recovered from a panegyric; Epigraphia Indica and the
      corpus of inscriptions.
