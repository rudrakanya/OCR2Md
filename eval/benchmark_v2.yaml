# =============================================================================
# eval/benchmark_v2.yaml — repaired retrieval benchmark, Phase 8.
#
# v1 (eval/benchmark_v1.yaml) is UNCHANGED and preserved. This file starts
# from all 30 of v1's queries, same stable IDs, and applies ONLY the fixes
# this phase could independently verify against the raw corpus text. See
# eval/benchmark_v2_notes.md for the full change log, the annotation policy
# (duplicate-OCR handling, unanswerable-query handling, source-discovery
# labelling), and this benchmark's limitations. Read that file before citing
# any number produced from this one.
#
# NEW FIELD vs v1: `source_discovery` on every entry --
#   "direct"          every relevant_books entry was found by reading/grepping
#                      the raw files myself, with no retrieval run first
#                      (this is what ALL of v1 claimed, and most of v2 still is)
#   "system-assisted"  at least one relevant_books entry was first SEEN in
#                      Phase 7's retrieval output, then independently
#                      re-verified by reading the raw source text before being
#                      added here (never added on retrieval rank/score alone)
# Per the task constraint for this phase: a benchmark is not claimed
# independent where labels were adjusted using the evaluated system's own
# results without that direct, textual re-verification. Every
# "system-assisted" entry below WAS re-verified against raw text -- the
# passages quoted in `evidence` are from directly reading the file, not from
# a query snippet.
#
# NEW FIELD: `review_marker` -- "none" | "uncertain" -- "uncertain" means a
# human reviewer should re-check this judgment; evidence is weaker or the
# relevance call is debatable, not wrong.
#
# Still unchanged from v1's schema and policy: book-level judging, no
# chunk-level (`relevant_chunks`) labels, `graded` for weighted relevance,
# `answerable` for deliberate traps, `heading`/`why`/`evidence` as free-text
# human-review aids silently ignored by src/evaluate.py's relevance().
# =============================================================================

meta:
  created_by: assistant
  created_on: 2026-10-10
  status: spot-checked, not peer-reviewed, not expert-validated
  judging: book_level (with a few `graded` weights); no chunk-level labels
  independence_note: >
    4 of 30 entries (BV-02, BV-11, BV-13, BV-19) were revised using a source
    first surfaced by retrieval output from Phase 7, then independently
    re-verified by reading the raw corpus file directly before being added.
    This is disclosed per-entry via source_discovery: system-assisted. The
    other 26 entries are carried over from v1 unchanged (source_discovery:
    direct throughout). This remains a single reviewer's pass -- see
    eval/benchmark_v2_notes.md for limitations.
  n_queries: 30
  supersedes: eval/benchmark_v1.yaml (preserved unchanged, not deleted)
  changelog: eval/benchmark_v2_notes.md

