# source book is in `plausible_books`. That is a proxy for on-topic-ness, not a
# judgement of the chunk itself — a gazetteer chunk tagged C03 might still be
# about population. Treat a low number as "look at this chapter", not as a
# verdict. `python -m src.tag --explain C03` shows you what it actually caught.
# -----------------------------------------------------------------------------
