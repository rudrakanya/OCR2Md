# =============================================================================
# eval/gold.yaml — labelled queries for the accuracy/precision harness (§10).
#
# READ THIS BEFORE TRUSTING ANY NUMBER OUT OF evaluate.py
# -----------------------------------------------------------------------------
# These 53 queries are a SEED that I wrote, and `relevant_books` records where I
# expected each answer to come from based on scanning the corpus — not on
# reading it. They are a starting point for you to correct, not ground truth.
# Until you have reviewed them, treat the metrics as a regression baseline
# ("did my change make things better or worse?") rather than as an absolute
# measure of quality.
#
# Ground truth here is BOOK-LEVEL: a retrieved chunk counts as relevant if it
# came from a book listed in `relevant_books`. That is coarser than
# passage-level judging — a chunk from the right book about the wrong subject
# still scores as a hit — so precision is measured optimistically. It is also
# the only labelling you can realistically maintain by hand over 4,338 chunks.
# To tighten a query, add `relevant_chunks` with specific chunk ids (get them
# from `python -m src.query "..." --json`) and the harness will prefer those.
#
# HOW TO EXTEND
#   - id             unique; convention is <chapter>-<n>
#   - query          what you would actually type
#   - chapter        the chapter this should be tagged to (checks tagging, §10.2)
#   - relevant_books filenames; ANY hit from these counts as relevant
#   - graded         optional {filename: 0..3} for nDCG; defaults to binary
#   - must_not_return optional list of chapter ids that must NOT appear in the
#                    top-k — the hard-negative test (§10.2)
#   - notes          free text, ignored by the harness
#
# Add as many as you like; the harness picks up new entries with no code change.
# =============================================================================

