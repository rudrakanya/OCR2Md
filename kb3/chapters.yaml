# =============================================================================
# kb3/chapters.yaml — chapter profiles (spec F). EDITABLE. Re-run
# `python stage2_build.py` after editing: it re-scores relevance and re-buckets
# from the stored vectors, without re-embedding.
#
# Seed terms are specific on purpose. Generic words ("now", "road", "tree",
# "Hindi", "should be") were removed after a test build: they matched śāstra
# and translation boilerplate and put 373 primary-text chunks into C16.
#
# RELEVANCE SCORE for chunk c against chapter k
#   The spec was truncated at this point, so this formula is mine. It is
#   documented here so you can replace it.
#
#     r(c,k) = w_lex·L(c,k) + w_dense·D(c,k) + w_prior·P(c,k)        ∈ [0,1]
#
#   L  lexical fit. Seed-term hits, each weighted by inverse document
#      frequency, so "temple" (everywhere) counts far less than "Bhūmija" or
#      "varṇanāgakṛpāṇikā". Saturated as 1 − exp(−Σ idf·log(1+tf) / tau), so
#      ten mentions are not ten times the evidence of one.
#   D  semantic fit. bge-m3 cosine between the chunk and the chapter's
#      `description`, rescaled per chapter against the corpus distribution
#      (mean → 0, 99th percentile → 1). Catches passages on-topic in words the
#      seed list lacks, including Hindi.
#   P  source prior from kb3/source_scores.yaml (e.g. Tiwari → C16).
#
#   A chunk is BUCKETED into k when r(c,k) ≥ bucket_threshold AND its
#   epistemic_status is in the chapter's `welcome` or `admitted` list.
#   `anchor` (optional) also buckets chunks by source + status/tag, where a
#   chapter is DEFINED by a source (C16 = Jagta Hua Kasba).
#   A chunk that clears no chapter at irrelevant_below goes to the review
#   queue → quarantine (reason: irrelevant). Spec C1: never deleted. Without
#   the dense component the irrelevance call is too weak to act on, so those
#   chunks stay active and are only queued for review.
#
# EPISTEMIC TOLERANCE
#   welcome   bucketed and ranked at full weight
#   admitted  bucketed, ranked with the chapter's admitted_penalty at query time
#   (absent)  scored, but not bucketed in this chapter
#   Folklore and opinion are tags, not statuses. `welcome_tags` lets C13/C16
#   admit folklore- or opinion-tagged chunks at full weight whatever their
#   status (spec C6).
#
# preferred_source_types: boost at query time within the chapter's ranking
#   (evidentiary rank), never used for bucket membership (topical fit). The
#   spec keeps these two decisions apart.
# =============================================================================

weights: {lexical: 0.40, dense: 0.45, prior: 0.15}
lexical_tau: 4.0
contextual_extra_threshold: 0.15   # contextual_background needs bucket_threshold + this, and is only ever 'admitted'
udaypur_specific_boost: 1.10       # query-time boost for chunks naming the town, temple or king
bucket_threshold: 0.30
irrelevant_below: 0.15
admitted_penalty: 0.85
preferred_type_boost: 1.10

