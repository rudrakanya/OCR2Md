          - {id: parmar-2025-origins-00003, snippet: "consistently documented"}
          - {id: parmar-2025-origins-00006, snippet: "this point is also validated"}
          - {id: intach-2022-udaypur-00084, snippet: "confirmed by the Udaypur prashasti", incidental: true}
