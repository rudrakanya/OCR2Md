  - id: K7
    topic: "Agnikula (fire-pit) origin of the Paramāras"
    chapters: [C5, C13]
    found_by: "agnikula|fire-pit|agnikund|अग्निकुल|अग्निकुंड near Paramara"
    evidence_note: >-
      The Udaipur praśasti and Padmagupta attest that the Paramāras BELIEVED in the fire-pit origin: a
      primary witness to the belief, not to the event. Ganguly treats it as bardic myth. Presenting it
      as validated history (Parmar 2025; INTACH 'confirmed by the Udaypur prashasti') confuses the
      two. Narrations of the legend are kept and tagged folklore.
    positions:
      - label: "the Paramāras claimed/believed a fire-pit origin (attested belief)"
        disposition: supported
        context: true
        add_tags: [folklore]
        chunks:
          - {id: ganguly-paramara-00018, snippet: "It was popularly believed that the founder"}
          - {id: ganguly-paramara-00025, snippet: "a hero arose from the fire-pit"}
          - {id: singh-1984-bhoja-00043, snippet: "created out of the firepit a hero"}
          - {id: tiwari-jhk-en-00521, snippet: "a hero arose out of the fire-pit"}
          - {id: rajpurohit-bhoj-en-00003, snippet: "born from the sacrificial fire-pit"}
          - {id: intach-2022-udaypur-00091, snippet: "origin of Parmara which is from agni-kula"}
      - label: "the agnikula story is myth, not history"
        disposition: supported
        chunks:
          - {id: ganguly-paramara-00032, snippet: "figment of imagination of the bards"}
          - {id: ganguly-paramara-00077, snippet: "very little importance should be attached to this mythical story"}
      - label: "agnikula origin is historically validated / confirmed"
        disposition: contradicted
        add_tags: [folklore]
        chunks:
