# =============================================================================
# Source registry — Stage 1B book-level defaults.
#
# Every chunk INHERITS source_type and provenance from its parent entry here
# (spec: "Every chunk keeps its parent book's category"). Epistemic status is
# NOT set here — it is read from each chunk's own language.
#
# work_id groups sources that are one intellectual work (a translation and its
# original; two volumes of one book; a composite that reproduces another).
# Stage 2 counts a work_id cluster as ONE source for corroboration, so the
# tally is not overstated. Nothing is merged or deleted on account of it.
#
# date_confidence: dated | approximate | undated-flagged   (never invented)
# Every date carries date_basis: where in the file (or outside it) it came from.
# =============================================================================

