#
# 1. OVERLAPPING "madhya bharat" FILES — three files share content:
#      madhya-bharat-cultural-heritage.md      (Patil 1952, standalone)
#      madhya-bharat-inscriptions-and-shrines.md   (Part I = the same Patil text)
#      madhya-bharat-temples-and-architecture.md   (Patil text + all of
#                                                   "Some Paramara Templess.md")
#    Left as-is, the same passage will be retrieved 2-3 times under different
#    book titles, which inflates precision@k and makes a single source look
#    like corroboration from several. Options:
#      (a) keep all three and let near-duplicate detection at ingest demote the
#          copies (I can add a shingle-based duplicate flag — recommended);
#      (b) drop the two composites and keep the standalone + Some Paramara;
#      (c) keep all three untouched.
#    Tell me which. Default if you say nothing: (a).
#
# 2. JAGTA HUA KASBA appears twice, Hindi original + English translation. That
#    is deliberate and useful (C18 anchor), but it is the same book. Recommend
#    keeping both and marking the pair via `translation_of`, which is done.
#    They will legitimately both surface for C18/C15 queries.
#
# 3. Raja_Bhoj_Aur_Parmarkaleen_EN.md's own header says the source PDF bundles
#    TWO works. If the second one is a distinct book you care about citing
#    separately, it needs its own row and a split.
